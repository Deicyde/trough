# The site moved to trough.jackmccarthy.org (wrangler.jsonc). GitHub Pages
# keeps the old address, deicyde.github.io/trough, as redirect/: a page that
# sends /trough/<path> to the same path on the new site. Every old page is
# missing there, so GitHub Pages serves 404.html, which redirects the same way.

name: Redirect

on:
  push:
    branches: [main]
    paths:
      - "redirect/**"
      - ".github/workflows/redirect.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redirect
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the redirect
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
