# Every library trough maps or plans to map, one [[library]] table each.
#
# Snapshot fields (head, head_date, toolchain, mathlib, lean_files) were read
# from GitHub on 2026-11-02, the Formal Frontier libraries' on 2026-11-08, and
# drift as the libraries move; a Formal Frontier library's commit is the one
# its data/ff/ record pins, so its entry has no head. Nor has Lean Pool's: its
# commit is the one data/lean-pool/ pins, and its snapshot fields were read at
# that pin on 2026-11-08. map_status is "live" (a chapter of this site),
# "elsewhere" (mapped on another site) or "planned"; map_unit says what one
# article will be. A Formal Frontier library's subject is its part of that
# chapter, one of SUBJECTS in tools/trough/catalog.py.


