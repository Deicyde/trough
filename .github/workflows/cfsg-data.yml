# Reads Axiom Math's CFSG at the commit data/cfsg/source.json pins
# (tools/refresh_cfsg.py): the top theorem, the reduction and its case
# theorems, each milestone module's declarations with their Lean statements,
# and the import graph of every Lean file but the certificates, read from the
# source without Lean. The pages are then regenerated from that data. The
# checkout is blobless and sparse: only the files the refresh reads.
#
# A push that changes the reader or the data runs it too, so the committed data
# always match the pin. The weekly run, or a dispatch with "newest", moves the
# pin to the newest main commit. On main, the commit job records the data and
# the pages, then starts the Pages and Tests workflows. On a pull request the
# run fails when the committed data differ from what the pin gives, and keeps a
# patch.

name: CFSG data

on:
  push:
    branches: [main]
    paths:
      - "tools/refresh_cfsg.py"
      - "tools/trough/cfsg.py"
      - "tools/trough/formal_conjectures.py"
      - "tools/trough/formalization.py"
      - "tools/trough/leansource.py"
      - "tools/trough/ff.py"
      - "data/cfsg/**"
      - ".github/workflows/cfsg-data.yml"
  pull_request:
    paths:
      - "tools/refresh_cfsg.py"
      - "tools/trough/cfsg.py"
      - "tools/trough/formal_conjectures.py"
      - "tools/trough/formalization.py"
      - "tools/trough/leansource.py"
      - "tools/trough/ff.py"
      - "data/cfsg/**"
      - ".github/workflows/cfsg-data.yml"
  workflow_dispatch:
    inputs:
      newest:
        description: Pin the newest CFSG commit
        type: boolean
        default: false
  schedule:
    - cron: "47 6 * * 5"

permissions:
  contents: read

concurrency:
  group: cfsg-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      rev: ${{ steps.pin.outputs.rev }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Outside pull requests, read the branch as it is now rather than the
      # commit that started the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}
          persist-credentials: false

      - name: Record the commit this run reads
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Choose the CFSG commit
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ github.event_name == 'schedule' || inputs.newest }}
        run: |
          set -euo pipefail
          rev=$(jq -r '.rev // empty' data/cfsg/source.json 2>/dev/null || true)
          if [ "$NEWEST" = true ] || [ -z "$rev" ]; then
            # The repository runs no CI, so the newest main commit is the one to read.
            rev=$(gh api repos/AxiomMath/CFSG/commits/main --jq .sha)
          fi
          echo "CFSG $rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Fetch CFSG at that commit
        env:
          REV: ${{ steps.pin.outputs.rev }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cfsg"
          git init --quiet "$dir"
          git -C "$dir" remote add origin https://github.com/AxiomMath/CFSG.git
          git -C "$dir" fetch --quiet --depth 1 --filter=blob:none origin "$REV"
          # Every Lean file but the certificates, about 3 GB: the import graph needs them all.
          git -C "$dir" sparse-checkout set --no-cone '/**/*.lean' '!/Certificates/**' '!/CFSG/Certificates/**' \
            /formalization.yaml /README.md /LICENSE /lean-toolchain /lake-manifest.json
          git -C "$dir" checkout --quiet FETCH_HEAD
          du -sh "$dir"

      - name: Read the proof
        run: uv run --no-dev python tools/refresh_cfsg.py "$RUNNER_TEMP/cfsg"

      - name: Regenerate the pages
        run: uv run --no-dev python tools/generate.py

      - name: Run the tests on the new data
        run: uv run pytest -q

      - name: Compare with the committed data
        id: compare
        run: |
          git add -A data/cfsg blueprint hooks/lean-links.json
          if git diff --cached --quiet; then
            echo "The committed data are what the pin gives."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat | tail -n 20
          git diff --cached --binary > cfsg-data.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
            echo "::error::The committed data differ from what the pin gives. Merge main and apply the patch: git fetch origin ${base} && git merge --no-edit ${base} && gh run download ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY} -n cfsg-data && git apply cfsg-data.patch"
            exit 1
          fi

      - name: Keep the patch
        if: always() && steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cfsg-data
          path: cfsg-data.patch
          retention-days: 14

      - name: Keep the data for the commit job
        if: steps.compare.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cfsg-data-files
          path: |
            data/cfsg/proof.json
            data/cfsg/source.json
          retention-days: 14

  # Records the data in the newest main, regenerating the pages with main's
  # generator, as the Formal Frontier data workflow does. Data changed
  # meanwhile win: that push's run records its own.
  commit:
    needs: refresh
    if: >-
      needs.refresh.outputs.changed == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cfsg-data-files
          path: ${{ runner.temp }}/data

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Commit the data and pages
        env:
          REV: ${{ needs.refresh.outputs.rev }}
          READ: ${{ needs.refresh.outputs.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # The artifact keeps the files without their common folder, data/cfsg.
          src="$RUNNER_TEMP/data"
          if (cd "$src" && find . -type f | sed 's|^\./||') | grep -vE '^(proof|source)\.json$'; then
            echo "::error::The data artifact holds the files listed above."
            exit 1
          fi
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            if ! git diff --quiet "$READ" HEAD -- data/cfsg; then
              echo "::notice::main has changed data/cfsg since ${READ:0:8}; that push's run records the data."
              exit 0
            fi
            cp "$src"/*.json data/cfsg/
            uv run --no-dev python tools/generate.py
            git add -A data/cfsg blueprint hooks/lean-links.json
            if git diff --cached --quiet; then
              echo "main already has this data."
              exit 0
            fi
            git commit --quiet -m "CFSG data at ${REV:0:8}"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Rebuild the site and run the tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
          gh workflow run tests.yml --ref main -R "$GITHUB_REPOSITORY"
