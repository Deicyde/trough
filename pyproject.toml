[project]
name = "trough"
version = "0.1.0"
description = "Maps of Lean formalization libraries, rendered with AutoformBot"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

# An empty workspace table keeps uv from adopting a pyproject.toml in a parent
# directory as this project's workspace root.
[tool.uv.workspace]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
