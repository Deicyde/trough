name: Tests

# The tests read the catalog and the committed data as well as the code, so
# every change runs them. The Mathlib data workflow starts them after its
# commits, which start no workflow on their own.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Run the tests
        run: uv run pytest -q

      # The wiki's links to Mathlib are literature-links annotations; check them with its own tool.
      - name: Check the wiki's annotations
        run: uvx --from "git+https://github.com/mathlib-initiative/literature-links@v1.0.2" literature-links scan wiki/mathlib wiki/unplaced
