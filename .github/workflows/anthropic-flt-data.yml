# Reads Anthropic's Lean proof of Fermat's Last Theorem at the commit
# data/anthropic-flt/source.json pins (tools/refresh_anthropic_flt.py):
# PROOF-PATH.md, the formalization.yaml, the landmarks, aliases, stages and
# citation graph of its web pages' data, and each landmark's Lean statement,
# read from the source without Lean. It links the repository's documentation
# site only when the site serves the landmarks' pages. The pages are then
# regenerated from that data. The repository is a blobless, sparse checkout of
# the files the refresh reads.
#
# A push that changes the reader or the data runs it too, so the committed data
# always match the pin. The weekly run, or a dispatch with "newest", moves the
# pin to the repository's newest commit. On main, the commit job records the
# data and the pages, then starts the Pages and Tests workflows. On a pull
# request the run fails when the committed data differ from what the pin gives,
# and keeps a patch.

name: Anthropic FLT data

on:
  push:
    branches: [main]
    paths:
      - "tools/refresh_anthropic_flt.py"
      - "tools/trough/anthropic_flt.py"
      - "tools/trough/formalization.py"
      - "tools/trough/leansource.py"
      - "data/anthropic-flt/**"
      - ".github/workflows/anthropic-flt-data.yml"
  pull_request:
    paths:
      - "tools/refresh_anthropic_flt.py"
      - "tools/trough/anthropic_flt.py"
      - "tools/trough/formalization.py"
      - "tools/trough/leansource.py"
      - "data/anthropic-flt/**"
      - ".github/workflows/anthropic-flt-data.yml"
  workflow_dispatch:
    inputs:
      newest:
        description: Pin the repository's newest commit
        type: boolean
        default: false
  schedule:
    - cron: "17 7 * * 4"

permissions:
  contents: read

concurrency:
  group: anthropic-flt-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPOSITORY: https://github.com/anthropics/fermats-last-theorem.git
  DOCS: https://tianyipeng.github.io/fermats-last-theorem/

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Outside pull requests, read the branch as it is now rather than the
      # commit that started the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}
          persist-credentials: false

      - name: Record the commit this run reads
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Fetch the repository at its pinned commit
        env:
          NEWEST: ${{ github.event_name == 'schedule' || inputs.newest }}
        run: |
          set -euo pipefail
          rev=""
          if [ -f data/anthropic-flt/source.json ]; then
            rev=$(uv run --no-dev python -c 'import json; print(json.load(open("data/anthropic-flt/source.json"))["rev"])')
          fi
          if [ "$NEWEST" = true ] || [ -z "$rev" ]; then
            rev=$(git ls-remote "$REPOSITORY" HEAD | cut -f1)
          fi
          dir="$RUNNER_TEMP/anthropic-flt"
          git init --quiet "$dir"
          git -C "$dir" remote add origin "$REPOSITORY"
          git -C "$dir" fetch --quiet --depth 1 --filter=blob:none origin "$rev"
          git -C "$dir" sparse-checkout set --no-cone /PROOF-PATH.md /formalization.yaml /html/data/meta.js \
            /html/data/edges.js /lean-toolchain /lake-manifest.json /LICENSE /FinalCheck.lean
          git -C "$dir" checkout --quiet FETCH_HEAD
          # The landmarks' statement files, which meta.js names.
          uv run --no-dev python tools/refresh_anthropic_flt.py "$dir" --files | sed 's|^|/|' > "$RUNNER_TEMP/statements.txt"
          git -C "$dir" sparse-checkout add --stdin < "$RUNNER_TEMP/statements.txt"
          echo "$rev: $(wc -l < "$RUNNER_TEMP/statements.txt") statement files"
          du -sh "$dir"

      - name: Read the repository
        run: uv run --no-dev python tools/refresh_anthropic_flt.py "$RUNNER_TEMP/anthropic-flt" --docs "$DOCS"

      - name: Regenerate the pages
        run: uv run --no-dev python tools/generate.py

      - name: Run the tests on the new data
        run: uv run pytest -q

      - name: Compare with the committed data
        id: compare
        run: |
          git add -A data/anthropic-flt blueprint hooks/lean-links.json
          if git diff --cached --quiet; then
            echo "The committed data are what the pin gives."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat | tail -n 20
          git diff --cached --binary > anthropic-flt-data.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
            echo "::error::The committed data differ from what the pin gives. Merge main and apply the patch: git fetch origin ${base} && git merge --no-edit ${base} && gh run download ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY} -n anthropic-flt-data && git apply anthropic-flt-data.patch"
            exit 1
          fi

      - name: Keep the patch
        if: always() && steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anthropic-flt-data
          path: anthropic-flt-data.patch
          retention-days: 14

      - name: Keep the data for the commit job
        if: steps.compare.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anthropic-flt-data-files
          path: data/anthropic-flt/
          retention-days: 14

  # Records the data in the newest main, regenerating the pages with main's
  # generator, as the Formal Frontier data workflow does. Data changed
  # meanwhile win: that push's run records its own.
  commit:
    needs: refresh
    if: >-
      needs.refresh.outputs.changed == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anthropic-flt-data-files
          path: ${{ runner.temp }}/data

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Commit the data and pages
        env:
          READ: ${{ needs.refresh.outputs.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/data"
          if (cd "$src" && find . -type f | sed 's|^\./||') | grep -vxE 'source\.json|landmarks\.json'; then
            echo "::error::The data artifact holds the files listed above."
            exit 1
          fi
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            if ! git diff --quiet "$READ" HEAD -- data/anthropic-flt; then
              echo "::notice::main has changed data/anthropic-flt since ${READ:0:8}; that push's run records the data."
              exit 0
            fi
            mkdir -p data/anthropic-flt
            cp "$src"/*.json data/anthropic-flt/
            uv run --no-dev python tools/generate.py
            git add -A data/anthropic-flt blueprint hooks/lean-links.json
            if git diff --cached --quiet; then
              echo "main already has this data."
              exit 0
            fi
            git commit --quiet -m "Anthropic FLT data"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Rebuild the site and run the tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
          gh workflow run tests.yml --ref main -R "$GITHUB_REPOSITORY"
