# Reads CompPoly at the commit data/comppoly/source.json pins, through the
# reusable Library data workflow (library-data.yml). The pin rule takes the
# newest main commit whose Lean Action CI passed; the build fetches Mathlib's
# cache and compiles CompPoly itself, its library target only.

name: CompPoly data

on:
  push:
    branches: [main]
    paths:
      - "tools/refresh_library.py"
      - "tools/trough/comppoly.py"
      - "tools/trough/library.py"
      - "tools/trough/stacks.py"
      - "tools/trough/leansource.py"
      - "tools/trough/formal_conjectures.py"
      - "tools/trough/ff.py"
      - "lean/library/**"
      - "data/comppoly/**"
      - ".github/workflows/comppoly-data.yml"
      - ".github/workflows/library-data.yml"
  pull_request:
    paths:
      - "tools/refresh_library.py"
      - "tools/trough/comppoly.py"
      - "tools/trough/library.py"
      - "tools/trough/stacks.py"
      - "tools/trough/leansource.py"
      - "tools/trough/formal_conjectures.py"
      - "tools/trough/ff.py"
      - "lean/library/**"
      - "data/comppoly/**"
      - ".github/workflows/comppoly-data.yml"
      - ".github/workflows/library-data.yml"
  workflow_dispatch:
    inputs:
      newest:
        description: Pin the newest CompPoly commit whose CI passed
        type: boolean
        default: false
  schedule:
    - cron: "23 8 * * 6"

permissions:
  contents: read

concurrency:
  group: comppoly-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  data:
    uses: ./.github/workflows/library-data.yml
    permissions:
      contents: write
      actions: write
    with:
      id: comppoly
      name: CompPoly
      repo: Verified-zkEVM/CompPoly
      roots: CompPoly
      newest: ${{ inputs.newest || false }}
      pin: |
        gh api "repos/Verified-zkEVM/CompPoly/actions/workflows/lean_action_ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
          --jq '.workflow_runs[0].head_sha'
      build: |
        lake exe cache get
        lake build CompPoly
