# Reads CSLib at the commit data/cslib/source.json pins, through the reusable
# Library data workflow (library-data.yml). The pin rule takes the newest main
# commit whose Lean Action CI passed; the build fetches Mathlib's cache and
# compiles CSLib itself.

name: CSLib data

on:
  push:
    branches: [main]
    paths:
      - "tools/refresh_library.py"
      - "tools/trough/cslib.py"
      - "tools/trough/library.py"
      - "tools/trough/stacks.py"
      - "tools/trough/leansource.py"
      - "tools/trough/formal_conjectures.py"
      - "tools/trough/ff.py"
      - "lean/library/**"
      - "data/cslib/**"
      - ".github/workflows/cslib-data.yml"
      - ".github/workflows/library-data.yml"
  pull_request:
    paths:
      - "tools/refresh_library.py"
      - "tools/trough/cslib.py"
      - "tools/trough/library.py"
      - "tools/trough/stacks.py"
      - "tools/trough/leansource.py"
      - "tools/trough/formal_conjectures.py"
      - "tools/trough/ff.py"
      - "lean/library/**"
      - "data/cslib/**"
      - ".github/workflows/cslib-data.yml"
      - ".github/workflows/library-data.yml"
  workflow_dispatch:
    inputs:
      newest:
        description: Pin the newest CSLib commit whose CI passed
        type: boolean
        default: false
  schedule:
    - cron: "37 6 * * 6"

permissions:
  contents: read

concurrency:
  group: cslib-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  data:
    uses: ./.github/workflows/library-data.yml
    permissions:
      contents: write
      actions: write
    with:
      id: cslib
      name: CSLib
      repo: leanprover/cslib
      roots: Cslib
      newest: ${{ inputs.newest || false }}
      pin: |
        gh api "repos/leanprover/cslib/actions/workflows/lean_action_ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
          --jq '.workflow_runs[0].head_sha'
      build: |
        lake exe cache get
        lake build
