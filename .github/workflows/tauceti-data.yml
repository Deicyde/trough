# Reads which declarations Tau Ceti's roadmaps name (tools/refresh_tauceti.py)
# at the pinned TauCetiRoadmap commit, and which declarations' docstrings name a
# result (lean/tauceti/TauCetiSurvey.lean, then tools/select_tauceti.py) at the
# pinned Tau Ceti commit; then each one's kind, docstring, signature and the
# nearest mapped declarations its statement and proof use
# (lean/tauceti/TauCetiDeps.lean). The pages are then regenerated from that data.
#
# A push that moves a pin, data/tauceti/source.json or roadmaps.json, runs it
# too, so the dump always matches the pins. On main, a dispatch or the weekly
# run, the commit job records the data and the pages, then starts the Pages and
# Tests workflows. On a pull request the
# run fails when the committed data differ from what this Lean gives, and keeps
# a patch.

name: Tau Ceti data

on:
  push:
    branches: [main]
    paths:
      - "lean/tauceti/**"
      - "tools/refresh_tauceti.py"
      - "tools/select_tauceti.py"
      - "tools/trough/tauceti.py"
      - "tools/trough/tauceti_select.py"
      - "data/tauceti/source.json"
      - "data/tauceti/roadmaps.json"
      - ".github/workflows/tauceti-data.yml"
  pull_request:
    paths:
      - "lean/tauceti/**"
      - "tools/refresh_tauceti.py"
      - "tools/select_tauceti.py"
      - "tools/trough/tauceti.py"
      - "tools/trough/tauceti_select.py"
      - "data/tauceti/source.json"
      - "data/tauceti/roadmaps.json"
      - ".github/workflows/tauceti-data.yml"
  workflow_dispatch:
    inputs:
      newest:
        description: Pin the newest Tau Ceti commit whose CI passed and the newest roadmaps
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 3"

permissions:
  contents: read

concurrency:
  group: tauceti-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      rev: ${{ steps.pin.outputs.rev }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Outside pull requests, read the branch as it is now rather than the
      # commit that started the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}
          persist-credentials: false

      - name: Record the commit this run reads
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free disk space for Tau Ceti and Mathlib
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - name: Add swap for importing all of Tau Ceti
        run: |
          set -euo pipefail
          sudo fallocate -l 24G /mnt/lean-swap
          sudo chmod 600 /mnt/lean-swap
          sudo mkswap /mnt/lean-swap
          sudo swapon /mnt/lean-swap
          free -h

      - name: Install elan v4.2.4
        run: |
          set -euo pipefail
          installer_dir="${RUNNER_TEMP}/elan-installer"
          archive="${installer_dir}/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # The weekly run and a "newest" dispatch move both pins: Tau Ceti to the
      # newest main commit whose CI passed, so its build cache exists, and the
      # roadmaps to their newest main commit.
      - name: Choose the Tau Ceti and roadmap commits
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ github.event_name == 'schedule' || inputs.newest }}
        run: |
          set -euo pipefail
          rev=$(jq -r '.rev // empty' data/tauceti/source.json 2>/dev/null || true)
          roadmap_rev=$(jq -r '.rev // empty' data/tauceti/roadmaps.json 2>/dev/null || true)
          if [ "$NEWEST" = true ] || [ -z "$rev" ]; then
            rev=$(gh api "repos/TauCetiProject/TauCeti/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha')
          fi
          if [ "$NEWEST" = true ] || [ -z "$roadmap_rev" ]; then
            roadmap_rev=$(gh api repos/TauCetiProject/TauCetiRoadmap/commits/main --jq .sha)
          fi
          echo "Tau Ceti $rev, roadmaps $roadmap_rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "roadmap_rev=$roadmap_rev" >> "$GITHUB_OUTPUT"

      - name: Fetch Tau Ceti and the roadmaps at those commits
        env:
          REV: ${{ steps.pin.outputs.rev }}
          ROADMAP_REV: ${{ steps.pin.outputs.roadmap_rev }}
        run: |
          set -euo pipefail
          for pair in "TauCeti $REV" "TauCetiRoadmap $ROADMAP_REV"; do
            set -- $pair
            dir="$RUNNER_TEMP/$1"
            git init --quiet "$dir"
            git -C "$dir" fetch --quiet --depth 1 "https://github.com/TauCetiProject/$1.git" "$2"
            git -C "$dir" checkout --quiet FETCH_HEAD
          done
          tauceti="$RUNNER_TEMP/TauCeti"
          date=$(TZ=UTC git -C "$tauceti" log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)
          printf '{\n "date": "%s",\n "repo": "TauCetiProject/TauCeti",\n "rev": "%s",\n "toolchain": "%s"\n}\n' \
            "$date" "$REV" "$(cat "$tauceti/lean-toolchain")" > data/tauceti/source.json

      - name: Read which declarations the roadmaps name
        run: uv run --no-dev python tools/refresh_tauceti.py "$RUNNER_TEMP/TauCetiRoadmap"

      # Tau Ceti's own oleans come from its public cache (scripts/lake-cache-get.sh),
      # Mathlib's from Mathlib's; `lake build` then compiles only what both miss.
      - name: Fetch the build caches
        working-directory: ${{ runner.temp }}/TauCeti
        run: |
          set -euo pipefail
          lake exe cache get
          bash scripts/lake-cache-get.sh .
          /usr/bin/time -v lake build
          du -sh .lake
          df -h /

      # Each Lean script runs below an import of every Tau Ceti module: the
      # root module imports nothing.
      - name: Survey every declaration's docstring
        working-directory: ${{ runner.temp }}/TauCeti
        env:
          TROUGH_OUT: ${{ runner.temp }}/survey.jsonl
        run: |
          set -euo pipefail
          find TauCeti -name '*.lean' | LC_ALL=C sort | sed 's|\.lean$||; s|/|.|g; s|^|import |' > "$RUNNER_TEMP/imports.lean"
          wc -l < "$RUNNER_TEMP/imports.lean"
          cat "$RUNNER_TEMP/imports.lean" "$GITHUB_WORKSPACE/lean/tauceti/TauCetiSurvey.lean" > TroughTauCetiSurvey.lean
          /usr/bin/time -v lake env lean TroughTauCetiSurvey.lean
          gzip -k "$RUNNER_TEMP/survey.jsonl"

      - name: Choose the results the docstrings name
        run: |
          set -euo pipefail
          uv run --no-dev python tools/select_tauceti.py "$RUNNER_TEMP/survey.jsonl"
          { jq -r '.roadmaps[].names[]' data/tauceti/roadmaps.json
            jq -r '.chosen | keys[]' data/tauceti/selection.json; } | LC_ALL=C sort -u > "$RUNNER_TEMP/names.txt"
          wc -l < "$RUNNER_TEMP/names.txt"

      - name: Read the declarations
        working-directory: ${{ runner.temp }}/TauCeti
        env:
          TROUGH_NAMES: ${{ runner.temp }}/names.txt
          TROUGH_OUT: ${{ github.workspace }}/data/tauceti/deps.json
          TROUGH_TAUCETI_REV: ${{ steps.pin.outputs.rev }}
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/imports.lean" "$GITHUB_WORKSPACE/lean/tauceti/TauCetiDeps.lean" > TroughTauCetiDeps.lean
          /usr/bin/time -v lake env lean TroughTauCetiDeps.lean

      - name: Regenerate the pages
        run: uv run --no-dev python tools/generate.py

      - name: Run the tests on the new data
        run: uv run pytest -q

      - name: Compare with the committed data
        id: compare
        run: |
          git add -A data/tauceti blueprint hooks/lean-links.json
          if git diff --cached --quiet; then
            echo "The committed data are this Tau Ceti's."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat | tail -n 20
          git diff --cached --binary > tauceti-data.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
            echo "::error::The committed data differ from this Lean's. Merge main and apply the patch: git fetch origin ${base} && git merge --no-edit ${base} && gh run download ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY} -n tauceti-data && git apply tauceti-data.patch"
            exit 1
          fi

      - name: Keep the patch
        if: always() && steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauceti-data
          path: tauceti-data.patch
          retention-days: 14

      - name: Keep the data for the commit job
        if: steps.compare.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauceti-data-files
          path: |
            data/tauceti/deps.json
            data/tauceti/roadmaps.json
            data/tauceti/selection.json
            data/tauceti/source.json
          retention-days: 14

      - name: Keep the dump
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauceti-deps
          path: |
            data/tauceti/
            ${{ runner.temp }}/names.txt
            ${{ runner.temp }}/survey.jsonl.gz
          retention-days: 14

  # Records the data in the newest main, regenerating the pages with main's
  # generator, as the Mathlib data workflow does. Only pins moved meanwhile win:
  # that push's run records the data.
  commit:
    needs: dump
    if: >-
      needs.dump.outputs.changed == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tauceti-data-files
          path: ${{ runner.temp }}/data

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Commit the data and pages
        env:
          REV: ${{ needs.dump.outputs.rev }}
          DUMPED: ${{ needs.dump.outputs.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # The artifact keeps the files without their common folder, data/tauceti.
          src="$RUNNER_TEMP/data"
          if (cd "$src" && find . -type f | sed 's|^\./||') | grep -vE '^(deps|roadmaps|selection|source)\.json$'; then
            echo "::error::The data artifact holds the files listed above."
            exit 1
          fi
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            if ! git diff --quiet "$DUMPED" HEAD -- data/tauceti/source.json data/tauceti/roadmaps.json; then
              echo "::notice::main has moved the Tau Ceti pins since ${DUMPED:0:8}; that push's run records the data."
              exit 0
            fi
            cp "$src"/*.json data/tauceti/
            uv run --no-dev python tools/generate.py
            git add -A data/tauceti blueprint hooks/lean-links.json
            if git diff --cached --quiet; then
              echo "main already has this data."
              exit 0
            fi
            git commit --quiet -m "Tau Ceti data at ${REV:0:8}"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Rebuild the site and run the tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
          gh workflow run tests.yml --ref main -R "$GITHUB_REPOSITORY"
