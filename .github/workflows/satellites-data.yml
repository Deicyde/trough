# Reads the satellite projects of data/satellites/projects.toml at the commits
# their records pin (tools/refresh_satellites.py): each one's Lake manifest,
# README, license and the .lean files of its Lean libraries, without Lean. The
# pages are then regenerated from that data. Each project is a blobless,
# sparse clone of the files the refresh reads; git over HTTPS uses no API
# quota, and the CI state of a new pin is one GraphQL query.
#
# A push that changes the reader or the data runs it too, so the committed data
# always match the pins. The weekly run, or a dispatch with "newest", moves a
# pin to its project's newest commit when the project's requirements, README
# opening or license text changed, or the pin is 90 days old. On main, the
# commit job records the data and the pages, then starts the Pages and Tests
# workflows. On a pull request the run fails when the committed data differ
# from what the pins give, and keeps a patch.

name: Satellite projects data

on:
  push:
    branches: [main]
    paths:
      - "tools/refresh_satellites.py"
      - "tools/trough/satellites.py"
      - "tools/trough/leansource.py"
      - "tools/trough/leanblueprint.py"
      - "data/satellites/**"
      - ".github/workflows/satellites-data.yml"
  pull_request:
    paths:
      - "tools/refresh_satellites.py"
      - "tools/trough/satellites.py"
      - "tools/trough/leansource.py"
      - "tools/trough/leanblueprint.py"
      - "data/satellites/**"
      - ".github/workflows/satellites-data.yml"
  workflow_dispatch:
    inputs:
      newest:
        description: Move pins to each project's newest commit where it changed
        type: boolean
        default: false
  schedule:
    - cron: "23 7 * * 5"

permissions:
  contents: read

concurrency:
  group: satellites-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # Outside pull requests, read the branch as it is now rather than the
      # commit that started the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}
          persist-credentials: false

      - name: Record the commit this run reads
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Read the projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-dev python tools/refresh_satellites.py ${{ (github.event_name == 'schedule' || inputs.newest) && '--newest' || '' }}

      - name: Regenerate the pages
        run: uv run --no-dev python tools/generate.py

      - name: Run the tests on the new data
        run: uv run pytest -q

      - name: Compare with the committed data
        id: compare
        run: |
          git add -A data/satellites blueprint hooks/lean-links.json
          if git diff --cached --quiet; then
            echo "The committed data are what the pins give."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat | tail -n 20
          git diff --cached --binary > satellites-data.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
            echo "::error::The committed data differ from what the pins give. Merge main and apply the patch: git fetch origin ${base} && git merge --no-edit ${base} && gh run download ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY} -n satellites-data && git apply satellites-data.patch"
            exit 1
          fi

      - name: Keep the patch
        if: always() && steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satellites-data
          path: satellites-data.patch
          retention-days: 14

      - name: Keep the data for the commit job
        if: steps.compare.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satellites-data-files
          path: data/satellites/
          retention-days: 14

  # Records the data in the newest main, regenerating the pages with main's
  # generator, as the Tau Ceti data workflow does. Data changed meanwhile win:
  # that push's run records its own.
  commit:
    needs: refresh
    if: >-
      needs.refresh.outputs.changed == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: satellites-data-files
          path: ${{ runner.temp }}/data

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Commit the data and pages
        env:
          READ: ${{ needs.refresh.outputs.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/data"
          if (cd "$src" && find . -type f | sed 's|^\./||') | grep -vE '^[a-z0-9-]+\.(json|toml)$'; then
            echo "::error::The data artifact holds the files listed above."
            exit 1
          fi
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            if ! git diff --quiet "$READ" HEAD -- data/satellites; then
              echo "::notice::main has changed data/satellites since ${READ:0:8}; that push's run records the data."
              exit 0
            fi
            cp "$src"/*.json data/satellites/
            uv run --no-dev python tools/generate.py
            git add -A data/satellites blueprint hooks/lean-links.json
            if git diff --cached --quiet; then
              echo "main already has this data."
              exit 0
            fi
            git commit --quiet -m "Satellite projects data"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Rebuild the site and run the tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
          gh workflow run tests.yml --ref main -R "$GITHUB_REPOSITORY"
