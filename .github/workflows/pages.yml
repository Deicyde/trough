name: Pages

on:
  push:
    branches: [main]
    # Everything the build reads.
    paths:
      - "blueprint/**"
      - "catalog/**"
      - "data/**"
      - "tools/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "theme/**"
      - "hooks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/autoform-ref"
      - ".github/workflows/pages.yml"
  # Every pull request runs, so the site job can be a required check. One that
  # changes none of the paths above skips the build; see the pick job.
  pull_request:
  workflow_dispatch:
    inputs:
      newest:
        description: Try autoform-bot's newest main commit
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: "https://github.com/facebookresearch/autoform-bot.git"

# Runs that publish share one group, so no two deploy or pin at once. Each pull
# request gets a group of its own, where a newer push replaces its run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The site builds with the Autoform commit in .github/autoform-ref. The daily
  # run, or a run started with "newest", tries autoform-bot's newest main commit
  # instead; once the site builds with it and is published, the pin job commits
  # the new pin. A commit that fails leaves the pin and the site as they were.
  pick:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      new: ${{ steps.pick.outputs.new }}
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the Autoform commit
        id: pick
        env:
          NEWEST: ${{ github.event_name == 'schedule' || inputs.newest }}
        run: |
          ref="$(cat .github/autoform-ref)"
          if [ "$NEWEST" = true ]; then
            newest="$(git ls-remote "$AUTOFORM_SOURCE" refs/heads/main | cut -f1)"
            if [ "$newest" != "$ref" ]; then
              ref="$newest"
              echo "new=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check whether the change touches what the build reads
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE"
          git -c core.quotePath=false diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed"
          if grep -qE \
            -e '^(blueprint|catalog|data|tools|scripts|theme|hooks)/' \
            -e '^(mkdocs\.yml|pyproject\.toml|uv\.lock)$' \
            -e '^\.github/(autoform-ref|workflows/pages\.yml)$' \
            "$RUNNER_TEMP/changed"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build the site
    needs: pick
    # A daily run with nothing new to try builds nothing, and neither does a
    # pull request that touches nothing the build reads.
    if: >-
      (github.event_name != 'schedule' || needs.pick.outputs.new == 'true') &&
      needs.pick.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      AUTOFORM_REF: ${{ needs.pick.outputs.ref }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # The vault is generated from data/, catalog/ and tools/; fail if the
      # committed pages differ from what the generator writes.
      - name: Check the generated pages
        run: uv run --no-dev python tools/generate.py --check

      # Rejects cycles and dangling links.
      - name: Validate the dependency graph
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform check blueprint

      # Audit findings are quality debt, not publication errors.
      - name: Audit the roadmap (report only)
        continue-on-error: true
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform audit blueprint

      - name: Render the blueprint
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform render blueprint
          --output site-src
          --repository-url "https://github.com/${GITHUB_REPOSITORY}"
          --ref "$GITHUB_SHA"

      - name: Build the Markdown site
        run: >-
          uvx --from mkdocs==1.6.1
          --with mkdocs-material==9.7.7
          --with mkdocs-literate-nav==0.6.2
          --with markdown==3.10.3
          --with pymdown-extensions==11.0.1
          mkdocs build --strict

      - name: Check published routes, anchors, and article cards
        run: python3 scripts/check_site.py site-src site

      - name: Upload Pages artifact
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # The check to require before merging. A skipped job counts as passing, so
  # the build alone would pass when the pick job failed and skipped it.
  site:
    needs: [pick, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a build that passed or had nothing to check
        env:
          PICK: ${{ needs.pick.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "pick: $PICK, build: $BUILD"
          [ "$PICK" = success ] && { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  pin:
    needs: [pick, build, deploy]
    if: needs.pick.outputs.new == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pages don't depend on the Autoform commit (the generator doesn't
      # import Autoform), so the pin is the commit's only change. A push made
      # with this token starts no workflow, so it does not rebuild the site.
      - name: Pin the Autoform commit the site was built with
        env:
          REF: ${{ needs.pick.outputs.ref }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          echo "$REF" > .github/autoform-ref
          git add .github/autoform-ref
          git commit --quiet -m "Build the site with Autoform ${REF:0:8}"
          git push --quiet origin "HEAD:main"
