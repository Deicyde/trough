# Reads a Lean library that tools/trough/library.py maps, at the commit
# data/<id>/source.json pins: each module's docstrings and declarations, read
# from the source without Lean (tools/refresh_library.py), then, after the
# library's own build, the modules each module's statements and proofs use and
# which of the names read are not public declarations in Lean
# (lean/library/LibraryDeps.lean, below an import of every module the build
# compiled). The pages are then regenerated from that data.
#
# Each library calls this from a short workflow of its own, which sets when it
# runs and passes its id, repository, roots, pin rule and build commands. On
# main, the commit job records the data and the pages, then starts the Pages
# and Tests workflows. On a pull request the run fails when the committed data
# differ from what the pin gives, and keeps a patch.

name: Library data

on:
  workflow_call:
    inputs:
      id:
        description: The library's id, its folder under data/ (aesop)
        type: string
        required: true
      name:
        description: The library's name, for messages and commits (Aesop)
        type: string
        required: true
      repo:
        description: Its repository on GitHub (leanprover-community/aesop)
        type: string
        required: true
      roots:
        description: The top components of its module names, separated by spaces (Aesop)
        type: string
        required: true
      pin:
        description: >-
          Bash that prints the commit to pin when the run moves the pin, with
          GH_TOKEN set; it should print nothing when no commit qualifies
        type: string
        required: true
      subdir:
        description: The folder of the repository its Lake project is in, when not the top (cedar-lean)
        type: string
        default: ""
      build:
        description: Bash that builds the library, run in its Lake project's folder
        type: string
        default: lake build
      newest:
        description: Move the pin to the commit the pin rule chooses
        type: boolean
        default: false
      timeout:
        description: The refresh job's timeout, in minutes
        type: number
        default: 60

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout }}
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      rev: ${{ steps.pin.outputs.rev }}
      sha: ${{ steps.head.outputs.sha }}
    env:
      ID: ${{ inputs.id }}
      NAME: ${{ inputs.name }}
      REPO: ${{ inputs.repo }}
    steps:
      # Outside pull requests, read the branch as it is now rather than the
      # commit that started the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}
          persist-credentials: false

      - name: Record the commit this run reads
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install elan v4.2.4
        run: |
          set -euo pipefail
          installer_dir="${RUNNER_TEMP}/elan-installer"
          archive="${installer_dir}/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$installer_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" \
            | sha256sum --check --strict
          tar xzf "$archive" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Choose the commit
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ github.event_name == 'schedule' || inputs.newest }}
          PIN: ${{ inputs.pin }}
        run: |
          set -euo pipefail
          rev=$(jq -r '.rev // empty' "data/$ID/source.json" 2>/dev/null || true)
          if [ "$NEWEST" = true ] || [ -z "$rev" ]; then
            rev=$(bash -euo pipefail -c "$PIN")
          fi
          if ! [[ "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The pin rule chose no $NAME commit: '$rev'."
            exit 1
          fi
          echo "$NAME $rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # The whole repository: lake builds it, and the refresh reads its modules
      # with the README and LICENSE.
      - name: Fetch the library at that commit
        env:
          REV: ${{ steps.pin.outputs.rev }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/library"
          git init --quiet "$dir"
          git -C "$dir" fetch --quiet --depth 1 "https://github.com/$REPO.git" "$REV"
          git -C "$dir" checkout --quiet FETCH_HEAD

      - name: Read the modules
        run: uv run --no-dev python tools/refresh_library.py "$ID" "$RUNNER_TEMP/library"

      - name: Build the library
        working-directory: ${{ runner.temp }}/library/${{ inputs.subdir }}
        env:
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          /usr/bin/time -v bash -euo pipefail -c "$BUILD"

      # Every module read whose build left an .olean is imported, so a module
      # that did not build is left unread rather than failing the run; the
      # names read from the source go in too, as Lean says which are public.
      - name: Read which modules each module uses
        working-directory: ${{ runner.temp }}/library/${{ inputs.subdir }}
        env:
          TROUGH_ROOTS: ${{ inputs.roots }}
          TROUGH_NAMES: ${{ runner.temp }}/names.txt
          TROUGH_OUT: ${{ github.workspace }}/data/${{ inputs.id }}/deps.json
          TROUGH_REV: ${{ steps.pin.outputs.rev }}
        run: |
          set -euo pipefail
          library="$GITHUB_WORKSPACE/data/$ID/library.json"
          jq -r '.modules[].items[] | select(.name) | .name' "$library" | LC_ALL=C sort -u > "$TROUGH_NAMES"
          wc -l < "$TROUGH_NAMES"
          : > imports.txt
          for module in $(jq -r '.modules[].module' "$library"); do
            if [ -f ".lake/build/lib/lean/${module//.//}.olean" ]; then
              echo "import $module" >> imports.txt
            fi
          done
          echo "$(wc -l < imports.txt) of $(jq '.modules | length' "$library") modules built"
          cat imports.txt "$GITHUB_WORKSPACE/lean/library/LibraryDeps.lean" > TroughLibraryDeps.lean
          /usr/bin/time -v lake env lean TroughLibraryDeps.lean

      - name: Regenerate the pages
        run: uv run --no-dev python tools/generate.py

      - name: Run the tests on the new data
        run: uv run pytest -q

      - name: Compare with the committed data
        id: compare
        run: |
          git add -A "data/$ID" blueprint hooks/lean-links.json
          if git diff --cached --quiet; then
            echo "The committed data are what the pin gives."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat | tail -n 20
          git diff --cached --binary > library-data.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
            echo "::error::The committed data differ from what the pin gives. Merge main and apply the patch: git fetch origin ${base} && git merge --no-edit ${base} && gh run download ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY} -n ${ID}-data && git apply library-data.patch"
            exit 1
          fi

      - name: Keep the patch
        if: always() && steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.id }}-data
          path: library-data.patch
          retention-days: 14

      - name: Keep the data for the commit job
        if: steps.compare.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.id }}-data-files
          path: |
            data/${{ inputs.id }}/deps.json
            data/${{ inputs.id }}/library.json
            data/${{ inputs.id }}/source.json
          retention-days: 14

  # Records the data in the newest main, regenerating the pages with main's
  # generator, as the other data workflows do. Data changed meanwhile win: that
  # push's run records its own.
  commit:
    needs: refresh
    if: >-
      needs.refresh.outputs.changed == 'true' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      ID: ${{ inputs.id }}
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.id }}-data-files
          path: ${{ runner.temp }}/data

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Commit the data and pages
        env:
          REV: ${{ needs.refresh.outputs.rev }}
          READ: ${{ needs.refresh.outputs.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # The artifact keeps the files without their common folder, data/<id>.
          src="$RUNNER_TEMP/data"
          if (cd "$src" && find . -type f | sed 's|^\./||') | grep -vE '^(deps|library|source)\.json$'; then
            echo "::error::The data artifact holds the files listed above."
            exit 1
          fi
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            if ! git diff --quiet "$READ" HEAD -- "data/$ID"; then
              echo "::notice::main has changed data/$ID since ${READ:0:8}; that push's run records the data."
              exit 0
            fi
            mkdir -p "data/$ID"
            cp "$src"/*.json "data/$ID/"
            uv run --no-dev python tools/generate.py
            git add -A "data/$ID" blueprint hooks/lean-links.json
            if git diff --cached --quiet; then
              echo "main already has this data."
              exit 0
            fi
            git commit --quiet -m "$NAME data at ${REV:0:8}"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Rebuild the site and run the tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
          gh workflow run tests.yml --ref main -R "$GITHUB_REPOSITORY"
