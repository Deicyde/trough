# Refreshes the leanblueprint libraries under data/blueprints/ from their
# repositories' newest commits: the TeX files each blueprint reads, or, for a
# library whose text trough may not reproduce, its structure.json. Nothing here
# runs Lean, so a library whose blueprint a Lean build writes (its source.json
# names "build") is refreshed elsewhere.
#
# The commit job records the new sources in the newest main, regenerates the
# pages there, and starts the Pages and Tests workflows.

name: Blueprint data

on:
  workflow_dispatch:
    inputs:
      library:
        description: Refresh only this library (its directory under data/blueprints/)
        type: string
        default: ""
  schedule:
    - cron: "23 6 * * 2"

permissions:
  contents: read

concurrency:
  group: blueprint-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      libraries: ${{ steps.refresh.outputs.libraries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Refresh each blueprint at its repository's newest commit
        id: refresh
        env:
          LIBRARY: ${{ inputs.library }}
        run: |
          set -euo pipefail
          refreshed=()
          for source in data/blueprints/*/source.json; do
            id=$(basename "$(dirname "$source")")
            if [ -n "$LIBRARY" ] && [ "$id" != "$LIBRARY" ]; then continue; fi
            if [ "$(jq -r '.build // empty' "$source")" != "" ]; then continue; fi
            repo=$(jq -r .repo "$source")
            entry=$(jq -r .entry "$source")
            checkout="$RUNNER_TEMP/src/$id"
            git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/$repo.git" "$checkout"
            git -C "$checkout" sparse-checkout set "$(dirname "$entry")"
            uv run --no-dev python tools/refresh_blueprints.py "$id" "$checkout"
            refreshed+=("$id")
          done
          echo "libraries=${refreshed[*]}" >> "$GITHUB_OUTPUT"

      - name: Regenerate the pages
        run: uv run --no-dev python tools/generate.py

      - name: Run the tests on the new sources
        run: uv run pytest -q

      - name: Compare with the committed sources
        id: compare
        run: |
          git add -A data/blueprints blueprint hooks/lean-links.json
          if git diff --cached --quiet; then
            echo "The committed blueprints are the newest."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat -- data/blueprints | tail -n 20
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the sources for the commit job
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueprint-data
          path: data/blueprints/
          retention-days: 14

  # Records the sources in the newest main, replacing only the libraries this
  # run refreshed, and regenerates the pages with main's generator. A push made
  # with this token starts no workflow, so it starts Pages and Tests.
  commit:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blueprint-data
          path: ${{ runner.temp }}/blueprints

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Commit the sources and pages
        env:
          LIBRARIES: ${{ needs.refresh.outputs.libraries }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/blueprints"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            uv run --no-dev python tools/generate.py --cited "$RUNNER_TEMP/cited-before.txt"
            for id in $LIBRARIES; do
              case "$id" in *[!a-z0-9-]*|"") echo "::error::Bad library id: $id"; exit 1;; esac
              rm -rf "data/blueprints/$id"
              cp -R "$src/$id" "data/blueprints/$id"
            done
            uv run --no-dev python tools/generate.py --cited "$RUNNER_TEMP/cited-after.txt"
            uv run --no-dev python tools/generate.py
            git add -A data/blueprints blueprint hooks/lean-links.json
            if git diff --cached --quiet; then
              echo "main already has these sources."
              exit 0
            fi
            git commit --quiet -m "Blueprint data: $LIBRARIES"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Rebuild the site and run the tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The names blueprint pages credit to Mathlib are in the Mathlib data's cited
          # list; when they change, the Mathlib data run describes them (at the same pin).
          if ! cmp -s "$RUNNER_TEMP/cited-before.txt" "$RUNNER_TEMP/cited-after.txt"; then
            gh workflow run mathlib-data.yml --ref main -R "$GITHUB_REPOSITORY"
          fi
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
          gh workflow run tests.yml --ref main -R "$GITHUB_REPOSITORY"
